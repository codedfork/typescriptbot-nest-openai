<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Open Ai Prompt Messenger</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <style>
        :root {
            --primary-color: #4361ee;
            --primary-light: #4895ef;
            --secondary-color: #3f37c9;
            --dark-color: #1a1a2e;
            --light-color: #f8f9fa;
            --success-color: #4cc9f0;
            --warning-color: #f72585;
            --gray-color: #adb5bd;
            --gray-dark: #495057;
            --border-radius: 12px;
            --box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
            --transition: all 0.3s ease;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background-color: var(--light-color);
            color: var(--dark-color);
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
            transition: var(--transition);
        }

        body.dark-mode {
            background-color: var(--dark-color);
            color: var(--light-color);
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem 2rem;
            background-color: white;
            box-shadow: var(--box-shadow);
            z-index: 10;
            transition: var(--transition);
        }

        body.dark-mode header {
            background-color: #16213e;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            font-size: 1.25rem;
            font-weight: 600;
        }

        .logo i {
            color: var(--primary-color);
            font-size: 1.5rem;
        }

        .status {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.9rem;
            padding: 0.5rem 1rem;
            border-radius: 50px;
            background-color: rgba(67, 97, 238, 0.1);
            transition: var(--transition);
        }

        .status i {
            font-size: 0.6rem;
        }

        .status.connected i {
            color: var(--success-color);
        }

        .status.disconnected i {
            color: var(--warning-color);
        }

        .status.connecting i {
            color: var(--gray-color);
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% {
                opacity: 0.5;
            }

            50% {
                opacity: 1;
            }

            100% {
                opacity: 0.5;
            }
        }

        #chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 1.5rem 2rem;
            display: flex;
            flex-direction: column;
            gap: 1rem;
            scroll-behavior: smooth;
        }

        .message {
            max-width: 80%;
            padding: 0.75rem 1.25rem;
            border-radius: var(--border-radius);
            position: relative;
            animation: fadeIn 0.3s ease-out;
            word-wrap: break-word;
            line-height: 1.5;
            box-shadow: var(--box-shadow);
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message.sent {
            align-self: flex-end;
            background-color: var(--primary-color);
            color: white;
            border-bottom-right-radius: 0;
        }

        body.dark-mode .message.sent {
            background-color: var(--secondary-color);
        }

        .message.received {
            align-self: flex-start;
            background-color: white;
            color: var(--dark-color);
            border-bottom-left-radius: 0;
        }

        body.dark-mode .message.received {
            background-color: #16213e;
            color: var(--light-color);
        }

        .message strong {
            font-size: 0.85rem;
            opacity: 0.8;
        }

        .message p {
            margin: 0.5rem 0;
        }

        .message-time {
            display: block;
            font-size: 0.7rem;
            text-align: right;
            opacity: 0.7;
        }

        .message.received .message-time {
            text-align: left;
        }

        .typing-indicator {
            display: none;
            align-items: center;
            gap: 0.5rem;
            padding: 0 2rem 1rem;
            font-size: 0.9rem;
            color: var(--gray-dark);
            opacity: 0.8;
        }

        body.dark-mode .typing-indicator {
            color: var(--gray-color);
        }

        .typing-indicator i {
            font-size: 0.8rem;
        }

        #message-form {
            display: flex;
            padding: 1rem 2rem;
            gap: 1rem;
            background-color: white;
            border-top: 1px solid rgba(0, 0, 0, 0.05);
            transition: var(--transition);
        }

        body.dark-mode #message-form {
            background-color: #16213e;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
        }

        .input-container {
            flex: 1;
            position: relative;
        }

        #message-input {
            width: 100%;
            min-height: 50px;
            max-height: 150px;
            padding: 0.75rem 1rem;
            border: none;
            border-radius: var(--border-radius);
            background-color: #f1f3f5;
            resize: none;
            font-family: 'Poppins', sans-serif;
            font-size: 0.95rem;
            transition: var(--transition);
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.05) inset;
        }

        body.dark-mode #message-input {
            background-color: #0f3460;
            color: var(--light-color);
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2) inset;
        }

        #message-input:focus {
            outline: none;
            box-shadow: 0 0 0 2px var(--primary-light);
        }

        body.dark-mode #message-input:focus {
            box-shadow: 0 0 0 2px var(--secondary-color);
        }

        #send-button {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            padding: 0 1.5rem;
            border: none;
            border-radius: var(--border-radius);
            background-color: var(--primary-color);
            color: white;
            font-weight: 500;
            cursor: pointer;
            transition: var(--transition);
        }

        #send-button:hover {
            background-color: var(--primary-light);
            transform: translateY(-2px);
        }

        body.dark-mode #send-button {
            background-color: var(--secondary-color);
        }

        body.dark-mode #send-button:hover {
            background-color: #3a0ca3;
        }

        #send-button:active {
            transform: translateY(0);
        }

        .prompt-button {
            display: inline-block;
            padding: 0.5rem 1rem;
            margin: 0.25rem;
            border: none;
            border-radius: 50px;
            background-color: rgba(67, 97, 238, 0.1);
            color: var(--primary-color);
            font-size: 0.85rem;
            cursor: pointer;
            transition: var(--transition);
        }

        body.dark-mode .prompt-button {
            background-color: rgba(63, 55, 201, 0.2);
            color: var(--light-color);
        }

        .prompt-button:hover {
            background-color: rgba(67, 97, 238, 0.2);
            transform: translateY(-2px);
        }

        body.dark-mode .prompt-button:hover {
            background-color: rgba(63, 55, 201, 0.3);
        }

        .theme-toggle {
            background: none;
            border: none;
            font-size: 1.2rem;
            cursor: pointer;
            color: var(--gray-dark);
            transition: var(--transition);
        }

        body.dark-mode .theme-toggle {
            color: var(--gray-color);
        }

        .theme-toggle:hover {
            color: var(--primary-color);
            transform: rotate(30deg);
        }

        body.dark-mode .theme-toggle:hover {
            color: var(--primary-light);
        }

        .header-controls {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        /* Responsive design */
        @media (max-width: 768px) {

            header,
            #message-form {
                padding: 1rem;
            }

            #chat-container {
                padding: 1rem;
            }

            .message {
                max-width: 90%;
            }

            #send-button span {
                display: none;
            }

            #send-button {
                padding: 0 1rem;
            }
        }

        /* Custom scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.05);
            border-radius: 10px;
        }

        ::-webkit-scrollbar-thumb {
            background: var(--primary-light);
            border-radius: 10px;
        }

        body.dark-mode ::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.05);
        }

        body.dark-mode ::-webkit-scrollbar-thumb {
            background: var(--secondary-color);
        }
    </style>
</head>

<body>
    <header>
        <div class="logo">
            <i class="fas fa-comment-dots"></i>
            <span>Open Ai Prompt Messenger</span>
        </div>
        <div class="header-controls">
            <button class="theme-toggle" id="theme-toggle">
                <i class="fas fa-moon"></i>
            </button>
            <div id="connection-status" class="status connecting">
                <i class="fas fa-circle"></i>
                <span>Connecting...</span>
            </div>
        </div>
    </header>

    <div id="chat-container"></div>

    <div id="typing-indicator" class="typing-indicator">
        <i class="fas fa-spinner fa-spin"></i>
        <span>AI is typing...</span>
    </div>

    <form id="message-form">
        <div class="input-container">
            <textarea id="message-input" placeholder="Type your message..." required></textarea>
        </div>
        <button type="submit" id="send-button">
            <i class="fas fa-paper-plane"></i>
            <span>Send</span>
        </button>
    </form>

    <script src="https://cdn.socket.io/4.8.1/socket.io.min.js"></script>
    <script>
        const socket = io("http://localhost:3000");
        const chatContainer = document.getElementById('chat-container');
        const messageForm = document.getElementById('message-form');
        const messageInput = document.getElementById('message-input');
        const connectionStatus = document.getElementById('connection-status');
        const typingIndicator = document.getElementById('typing-indicator');
        const themeToggle = document.getElementById('theme-toggle');

        // Theme toggle functionality
        themeToggle.addEventListener('click', () => {
            document.body.classList.toggle('dark-mode');
            const isDarkMode = document.body.classList.contains('dark-mode');
            themeToggle.innerHTML = isDarkMode ? '<i class="fas fa-sun"></i>' : '<i class="fas fa-moon"></i>';
            localStorage.setItem('darkMode', isDarkMode);
        });

        // Check for saved theme preference
        if (localStorage.getItem('darkMode') === 'true') {
            document.body.classList.add('dark-mode');
            themeToggle.innerHTML = '<i class="fas fa-sun"></i>';
        }

        socket.on('connect', () => {
            connectionStatus.innerHTML = '<i class="fas fa-circle"></i> <span>Connected</span>';
            connectionStatus.classList.add('connected');
            connectionStatus.classList.remove('disconnected', 'connecting');
            addMessage('System', 'You are now connected to the chat!', 'received');
        });

        socket.on('disconnect', () => {
            connectionStatus.innerHTML = '<i class="fas fa-circle"></i> <span>Disconnected</span>';
            connectionStatus.classList.add('disconnected');
            connectionStatus.classList.remove('connected', 'connecting');
        });

        socket.on('connect_error', () => {
            connectionStatus.innerHTML = '<i class="fas fa-circle"></i> <span>Connection Failed</span>';
            connectionStatus.classList.add('disconnected');
            connectionStatus.classList.remove('connected', 'connecting');
        });

        socket.on('message', (data) => {
            addMessage('AI Assistant', data, 'received');
            typingIndicator.style.display = 'none';
        });

        socket.on('prompts', (prompts) => {
            prompts = JSON.parse(prompts);
            console.log(prompts);
            const promptContainer = document.createElement('div');
            promptContainer.style.display = 'flex';
            promptContainer.style.flexWrap = 'wrap';
            promptContainer.style.margin = '0.5rem 0';
            promptContainer.style.gap = '0.5rem';

            prompts.forEach(prompt => {
                const button = document.createElement('button');
                button.textContent = prompt;
                button.classList.add('prompt-button');
                button.onclick = () => handlePromptClick(prompt);
                promptContainer.appendChild(button);
            });

            chatContainer.appendChild(promptContainer);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        });

        socket.on('typing', () => {
            typingIndicator.style.display = 'flex';
        });

        socket.on('stopTyping', () => {
            typingIndicator.style.display = 'none';
        });

        messageForm.addEventListener('submit', (event) => {
            event.preventDefault();
            const messageText = messageInput.value.trim();
            if (messageText) {
                addMessage('You', messageText, 'sent');
                socket.emit('message', messageText);
                messageInput.value = '';
                messageInput.style.height = 'auto';
                typingIndicator.style.display = 'flex';
            }
        });

        let typing = false;
        let timeout;

        messageInput.addEventListener('input', function () {
            this.style.height = 'auto';
            this.style.height = (this.scrollHeight) + 'px';

            if (!typing) {
                typing = true;
                socket.emit('typing');
            }

            clearTimeout(timeout);
            timeout = setTimeout(() => {
                typing = false;
                socket.emit('stopTyping');
            }, 1000);
        });

        messageInput.addEventListener('keydown', function (event) {
            if (event.key === 'Enter' && !event.shiftKey) {
                event.preventDefault();
                messageForm.dispatchEvent(new Event('submit'));
            }
        });

        function addMessage(sender, text, type) {
            const messageElement = document.createElement('div');
            messageElement.classList.add('message', type);
            const time = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            messageElement.innerHTML = `
        <strong>${sender}</strong>
        <p>${text}</p>
        <span class="message-time">${time}</span>
      `;
            chatContainer.appendChild(messageElement);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        function handlePromptClick(callback) {
            socket.emit('message', callback);
            addMessage('You', callback, 'sent');
            typingIndicator.style.display = 'flex';
        }

        window.addEventListener('load', () => {
            messageInput.focus();
        });
    </script>
</body>

</html>
